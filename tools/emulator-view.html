<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATRI · 小米手环8 Pro</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1824;color:#e4f0fb;font:15px system-ui;min-height:100vh;display:grid;place-items:center}main{display:flex;align-items:center;gap:36px;padding:24px}.frame{width:360px;flex-shrink:0;padding:12px;background:#263444;border-radius:46px;box-shadow:0 20px 70px #0008}.screen{width:336px;aspect-ratio:7/10;overflow:hidden;border-radius:40px;background:black;position:relative}img{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer;touch-action:none}aside{max-width:300px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.7;color:#adbfce}strong{color:#e4f0fb}button{display:block;width:220px;margin:12px 0;padding:13px;border:0;border-radius:10px;background:#244964;color:white;font-size:16px;cursor:pointer}#status{font-size:13px;min-height:44px;white-space:pre-wrap}@media(max-width:740px){main{flex-direction:column;gap:20px;padding:16px}.frame{width:min(360px,calc(100vw - 32px))}.screen{width:100%;height:auto}aside{max-width:340px}}</style>
<main><div class="frame"><div class="screen"><img id="screen" alt="ATRI 小米手环8 Pro 官方 Vela 模拟器实时画面"></div></div><aside><h1>ATRI · 小米手环8 Pro</h1><p><strong>336 × 480 · 7∶10 竖屏</strong><br>小米手环 8 Pro · 336 × 480<br>点击屏幕即可操作。</p><p>点击屏幕推进剧情，拖动正文滚动。这里显示虚拟机的真实画面，未按手表比例拉伸。</p><button onclick="command('start')">打开 ATRI</button><button onclick="command('wake')">唤醒虚拟屏幕</button><p id="status">正在核对设备…</p><p>设备：AtriBand8Pro-336x480<br>控制端口：43141<br>运行时：官方 Vela 5.0 通用手表/手环镜像，不等同实机固件。</p></aside></main>
<script>
const screen=document.querySelector('#screen'),status=document.querySelector('#status');let updating=false,identityOK=false,down=null;
async function verify(){const r=await fetch('/info'),i=await r.json();if(i.name!=='AtriBand8Pro-336x480'||i.packageName!=='com.codex.atri.band8pro')throw Error('设备身份不符，已禁止操作');identityOK=true;status.textContent='已连接 ATRI 独立手环设备。';}
async function command(endpoint){try{if(!identityOK)throw Error('设备身份尚未核实');const r=await fetch('/'+endpoint),d=await r.json();if(!r.ok)throw Error(d.error);status.textContent=typeof d==='string'?(d||'操作完成'):JSON.stringify(d);}catch(e){status.textContent=e.message;}}
const point=e=>{const r=screen.getBoundingClientRect(),w=screen.naturalWidth||336,h=screen.naturalHeight||480;return{x:Math.max(0,Math.min(w-1,Math.round((e.clientX-r.left)*w/r.width))),y:Math.max(0,Math.min(h-1,Math.round((e.clientY-r.top)*h/r.height)))}};
screen.addEventListener('pointerdown',e=>{if(!identityOK)return;down=point(e);screen.setPointerCapture(e.pointerId)});screen.addEventListener('pointerup',async e=>{if(!down)return;const end=point(e),start=down;down=null;if(Math.hypot(end.x-start.x,end.y-start.y)>8)await command(`drag?x0=${start.x}&y0=${start.y}&x1=${end.x}&y1=${end.y}`);else await command(`click?x=${end.x}&y=${end.y}`)});screen.addEventListener('dragstart',e=>e.preventDefault());screen.addEventListener('pointercancel',()=>down=null);
async function refresh(){if(updating||!identityOK)return;updating=true;try{const r=await fetch('/screen?t='+Date.now());if(!r.ok)throw Error((await r.json()).error);const u=URL.createObjectURL(await r.blob()),old=screen.src;screen.src=u;if(old.startsWith('blob:'))URL.revokeObjectURL(old);}catch(e){status.textContent=e.message;}finally{updating=false}}
verify().then(()=>{refresh();setInterval(refresh,500)}).catch(e=>status.textContent=e.message);
</script></html>
